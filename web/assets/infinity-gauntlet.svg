<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72" role="img" aria-labelledby="title description">
  <title id="title">관리자 블록형 인피니티 건틀릿</title>
  <desc id="description">검은 전시대 위에 세워진 황금 블록 건틀릿과 여섯 개의 색상 스톤</desc>
  <defs>
    <linearGradient id="brickGold" x1="11" y1="4" x2="51" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff09a"/>
      <stop offset=".24" stop-color="#f4c542"/>
      <stop offset=".58" stop-color="#cc8c18"/>
      <stop offset="1" stop-color="#85500d"/>
    </linearGradient>
    <linearGradient id="palmGold" x1="18" y1="30" x2="47" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7d95c"/>
      <stop offset="1" stop-color="#a56510"/>
    </linearGradient>
    <filter id="stoneGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation=".9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- LEGO 전시 모델처럼 보이는 검은 받침대 -->
  <path d="M19 58h27l4 9H14Z" fill="#17191f" stroke="#090a0d" stroke-width="2" stroke-linejoin="round"/>
  <path d="M12 67h40v4H12Z" fill="#252832" stroke="#090a0d" stroke-width="2"/>
  <path d="M22 61h21" stroke="#59606f" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 손목과 손바닥: 블록 판이 층층이 쌓인 실루엣 -->
  <path d="M22 47h23l2 14H18Z" fill="url(#brickGold)" stroke="#6c3f09" stroke-width="2" stroke-linejoin="round"/>
  <path d="M18 31 27 25h16l7 8-5 20H23l-8-11Z" fill="url(#palmGold)" stroke="#6c3f09" stroke-width="2" stroke-linejoin="round"/>
  <path d="M21 48h25M20 53h26M23 58h22" fill="none" stroke="#81500d" stroke-width="1.4" opacity=".85"/>
  <path d="m18 34 8 4h18l5-4M20 42h27" fill="none" stroke="#fff0a0" stroke-width="1.2" opacity=".72"/>

  <!-- 엄지: 왼쪽으로 꺾인 관절형 블록 -->
  <path d="m19 35-8-7-5 5 10 13 7-4Z" fill="url(#brickGold)" stroke="#6c3f09" stroke-width="2" stroke-linejoin="round"/>
  <path d="m10 29 6 5m-3 5 6-5" stroke="#8b5710" stroke-width="1.4"/>

  <!-- 세워진 네 손가락: 높이가 다른 블록 조형 -->
  <path d="M22 29 20 11l4-7 5 3 1 21Z" fill="url(#brickGold)" stroke="#6c3f09" stroke-width="2" stroke-linejoin="round"/>
  <path d="M29 27 29 5l4-4 5 3-1 23Z" fill="url(#brickGold)" stroke="#6c3f09" stroke-width="2" stroke-linejoin="round"/>
  <path d="m37 27 2-20 5-3 4 5-4 21Z" fill="url(#brickGold)" stroke="#6c3f09" stroke-width="2" stroke-linejoin="round"/>
  <path d="m44 30 5-15 5-1 3 6-7 17Z" fill="url(#brickGold)" stroke="#6c3f09" stroke-width="2" stroke-linejoin="round"/>

  <!-- 손가락마다 보이는 브릭 경계와 스터드 -->
  <g fill="none" stroke="#84500d" stroke-width="1.3" opacity=".9">
    <path d="m21 13 8 1m-7 7 8 1M30 9h8m-8 8h8M39 12l8 1m-9 7 8 1M48 20l7 3m-9 4 7 3"/>
  </g>
  <g fill="#ffe77a" stroke="#8d5a10" stroke-width=".8">
    <ellipse cx="24.5" cy="9" rx="2.2" ry="1.2"/>
    <ellipse cx="33.5" cy="5.5" rx="2.2" ry="1.2"/>
    <ellipse cx="43" cy="8.5" rx="2.2" ry="1.2"/>
    <ellipse cx="52" cy="18.5" rx="2.2" ry="1.2"/>
  </g>

  <!-- 손등과 너클의 여섯 인피니티 스톤 -->
  <g stroke="#fff7c4" stroke-width="1.2" filter="url(#stoneGlow)">
    <circle cx="23" cy="30" r="3" fill="#e83d4d"/>
    <circle cx="31" cy="28" r="3" fill="#397df0"/>
    <circle cx="40" cy="29" r="3" fill="#9448db"/>
    <circle cx="48" cy="33" r="3" fill="#f07823"/>
    <circle cx="27" cy="39" r="3.2" fill="#2fc46e"/>
    <path d="m37 34 4 3-1.5 5H34l-1.5-5Z" fill="#ffd629"/>
  </g>

  <!-- 중앙 판금과 블록 하이라이트 -->
  <path d="m26 45 6-3 7 2 5 5H24Z" fill="#bc7912" stroke="#744409" stroke-width="1.2"/>
  <path d="M24 50h19" stroke="#ffe889" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
</svg>

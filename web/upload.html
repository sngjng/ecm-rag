<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>보험약관AI · 자료 업로드</title>
<style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#15243b;background:#f5f7fa}*{box-sizing:border-box}
body{margin:0}.bar{background:#fff;border-bottom:1px solid #dbe3ed;padding:19px max(20px,calc((100vw - 960px)/2));font-weight:700;color:#0866ae}
main{max-width:960px;margin:40px auto;padding:0 20px}.card{background:#fff;border:1px solid #e1e7ee;border-radius:16px;padding:28px;box-shadow:0 6px 24px #15243b0b}
h1{font-size:25px;margin:0 0 8px}p{color:#50627a;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
label{display:block;font-size:14px;font-weight:650;margin-top:18px}input,select{display:block;width:100%;padding:12px;border:1px solid #c9d5e2;border-radius:8px;margin-top:7px;font:inherit;background:white}
button{background:#0866ae;color:#fff;border:0;border-radius:8px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer;margin-top:24px}button:disabled{opacity:.5;cursor:default}
#message{white-space:pre-wrap;background:#f2f6fb;border-radius:8px;padding:14px;margin-top:20px;min-height:48px}small{color:#607087}
@media(max-width:680px){.grid{grid-template-columns:1fr}.card{padding:20px}}
</style></head><body><div class="bar">보험약관AI · 지식자료 수집</div><main><div class="card"><h1>문서 업로드</h1>
<p>파일은 서버의 지정된 업로드 디렉터리에 저장된 후, 별도 작업자가 문서 유형에 맞게 처리합니다.</p>
<form id="upload"><label>API 키<input id="key" type="password" autocomplete="off" required placeholder="관리자에게 발급받은 키"></label>
<div class="grid"><label>자료 유형<select name="content_type" id="type"><option value="document">운영/보험 문서</option><option value="incident">장애 이력</option><option value="error_trace">로그·스택트레이스</option><option value="source_code">소스코드</option></select></label>
<label>세부 유형<input name="subtype" value="general" placeholder="예: operation_manual"></label>
<label>제목<input name="title" placeholder="비우면 파일명 사용"></label><label>시스템명<input name="system_name" placeholder="예: 계약계"></label>
<label>버전<input name="version_label" placeholder="예: 2026.09"></label><label>저장소 / 리포지토리<input name="repository" placeholder="소스코드는 필수"></label>
<label>브랜치<input name="branch" placeholder="예: release/2026.09"></label><label>저장소 내 상대 경로<input name="logical_path" placeholder="예: src/main/java/.../Payment.java"></label>
<label>파일<input type="file" name="file" id="file" required accept=".pdf,.docx,.txt,.md,.log,.py,.java,.sql,.js,.sh,.yml,.yaml"><small>기본 최대 100 MB. 파일 유형에 따라 허용 확장자가 다릅니다.</small></label></div>
<button id="submit" type="submit">업로드하고 처리 시작</button></form><div id="message" role="status" aria-live="polite">대기 중</div></div></main>
<script>
const form=document.querySelector('#upload'),message=document.querySelector('#message'),button=document.querySelector('#submit');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;message.textContent='업로드 중…';
const key=document.querySelector('#key').value,body=new FormData(form);try{
const response=await fetch('/api/uploads',{method:'POST',headers:{'X-API-Key':key},body});const result=await response.json();
if(!response.ok)throw new Error(JSON.stringify(result.detail));
message.textContent=`접수 완료: ${result.asset_id}\n현재 상태: ${result.status}`;
const assetId=result.asset_id;
for(let i=0;i<240;i++){await new Promise(resolve=>setTimeout(resolve,3000));const r=await fetch(`/api/uploads/${assetId}`,{headers:{'X-API-Key':key}});
if(!r.ok)throw new Error('상태 조회 실패');const state=await r.json();
message.textContent=`작업 ID: ${assetId}\n상태: ${state.status}\n인덱싱된 청크: ${state.chunk_count}`+(state.error_detail?`\n오류: ${state.error_detail}`:'');
if(state.status==='completed'||state.status==='failed')break;}
}catch(error){message.textContent=`요청 실패: ${error.message}`;}finally{button.disabled=false;}});
</script></body></html>

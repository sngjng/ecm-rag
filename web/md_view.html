<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>문서 미리보기</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7fb;
        --surface: #ffffff;
        --surface-soft: #f8fafc;
        --text: #172033;
        --muted: #657189;
        --line: #e3e8f1;
        --primary: #4456e8;
        --primary-soft: #e9edff;
        --danger: #c43b55;
        --danger-soft: #fff0f3;
        --shadow: 0 24px 70px rgba(28, 39, 67, 0.09);
        font-family:
          Inter, Pretendard, "Noto Sans KR", "Malgun Gothic", system-ui,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(
            circle at 12% -10%,
            rgba(68, 86, 232, 0.11),
            transparent 34rem
          ),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid rgba(227, 232, 241, 0.9);
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(18px);
      }

      .topbar__inner {
        display: flex;
        min-height: 68px;
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 28px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 12px;
        font-weight: 800;
      }

      .brand img {
        display: block;
        width: 96px;
        height: auto;
      }

      .brand__divider {
        width: 1px;
        height: 19px;
        background: #cbd4e2;
      }

      .brand__label {
        overflow: hidden;
        font-size: 15px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .topbar__link,
      .button {
        display: inline-flex;
        min-height: 36px;
        padding: 8px 12px;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--primary);
        background: var(--surface);
        font-size: 12px;
        font-weight: 800;
        text-decoration: none;
      }

      .topbar__link:hover,
      .button:hover {
        border-color: var(--primary);
        background: var(--primary-soft);
      }

      .topbar__link:focus-visible,
      .button:focus-visible,
      .markdown-body a:focus-visible {
        outline: 3px solid rgba(68, 86, 232, 0.22);
        outline-offset: 2px;
      }

      main {
        max-width: 1240px;
        margin: 0 auto;
        padding: 42px 28px 72px;
      }

      .viewer-layout {
        display: grid;
        grid-template-columns: minmax(210px, 250px) minmax(0, 1fr);
        align-items: start;
        gap: 30px;
      }

      .document-column {
        min-width: 0;
      }

      .toc-panel {
        position: sticky;
        top: 92px;
        max-height: calc(100vh - 116px);
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 14px 38px rgba(28, 39, 67, 0.07);
      }

      .toc-panel summary {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        padding: 16px 17px;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        cursor: pointer;
        font-size: 13px;
        font-weight: 900;
        list-style: none;
      }

      .toc-panel summary::-webkit-details-marker {
        display: none;
      }

      .toc-panel summary::after {
        content: "−";
        color: var(--muted);
        font-size: 18px;
        font-weight: 500;
      }

      .toc-panel:not([open]) summary {
        border-bottom: 0;
      }

      .toc-panel:not([open]) summary::after {
        content: "+";
      }

      .toc-nav {
        display: grid;
        padding: 10px;
        gap: 2px;
      }

      .toc-nav__empty {
        margin: 0;
        padding: 10px 8px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      .toc-nav a {
        display: block;
        padding: 8px 9px;
        border-left: 2px solid transparent;
        border-radius: 0 8px 8px 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
        text-decoration: none;
        transition:
          color 0.16s ease,
          border-color 0.16s ease,
          background 0.16s ease;
      }

      .toc-nav a[data-level="2"] {
        padding-left: 18px;
      }

      .toc-nav a[data-level="3"] {
        padding-left: 28px;
        font-size: 11px;
      }

      .toc-nav a:hover,
      .toc-nav a.is-active {
        border-left-color: var(--primary);
        color: var(--primary);
        background: var(--primary-soft);
      }

      .document-head {
        margin-bottom: 20px;
      }

      .document-head__eyebrow {
        margin: 0 0 9px;
        color: var(--primary);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.12em;
      }

      h1 {
        margin: 0;
        font-size: clamp(25px, 4vw, 38px);
        line-height: 1.25;
        letter-spacing: -0.035em;
      }

      .document-head__meta {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .document-actions {
        display: flex;
        margin: 18px 0 24px;
        flex-wrap: wrap;
        gap: 8px;
      }

      .button--primary {
        border-color: var(--primary);
        color: #fff;
        background: var(--primary);
      }

      .button--primary:hover {
        color: #fff;
        background: #3545c7;
      }

      .viewer {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .viewer__status {
        display: flex;
        min-height: 260px;
        padding: 40px;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        text-align: center;
        line-height: 1.7;
      }

      .viewer__status--error {
        color: var(--danger);
        background: var(--danger-soft);
      }

      .markdown-body {
        padding: clamp(28px, 6vw, 64px);
        font-size: 15px;
        line-height: 1.8;
        overflow-wrap: anywhere;
      }

      .markdown-body > :first-child {
        margin-top: 0;
      }

      .markdown-body > :last-child {
        margin-bottom: 0;
      }

      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3,
      .markdown-body h4,
      .markdown-body h5,
      .markdown-body h6 {
        margin: 1.8em 0 0.7em;
        scroll-margin-top: 92px;
        line-height: 1.35;
        letter-spacing: -0.025em;
      }

      .markdown-body h1 {
        padding-bottom: 0.35em;
        border-bottom: 1px solid var(--line);
        font-size: 2em;
      }

      .markdown-body h2 {
        padding-bottom: 0.3em;
        border-bottom: 1px solid var(--line);
        font-size: 1.55em;
      }

      .markdown-body h3 {
        font-size: 1.28em;
      }

      .markdown-body p,
      .markdown-body ul,
      .markdown-body ol,
      .markdown-body blockquote,
      .markdown-body pre,
      .markdown-body table {
        margin: 0 0 1.2em;
      }

      .markdown-body li + li {
        margin-top: 0.25em;
      }

      .markdown-body blockquote {
        padding: 0.2em 1em;
        border-left: 4px solid var(--primary);
        color: var(--muted);
        background: var(--surface-soft);
      }

      .markdown-body code {
        padding: 0.15em 0.38em;
        border-radius: 5px;
        background: #eef1f7;
        font-family: Consolas, "SFMono-Regular", monospace;
        font-size: 0.9em;
      }

      .markdown-body pre {
        overflow-x: auto;
        padding: 18px;
        border-radius: 12px;
        color: #e7ecff;
        background: #182033;
        line-height: 1.6;
      }

      .markdown-body pre code {
        padding: 0;
        color: inherit;
        background: transparent;
      }

      .markdown-body table {
        display: block;
        width: 100%;
        overflow-x: auto;
        border-collapse: collapse;
      }

      .markdown-body th,
      .markdown-body td {
        min-width: 120px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
      }

      .markdown-body th {
        background: var(--surface-soft);
      }

      .markdown-body a {
        color: var(--primary);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      .markdown-body hr {
        margin: 2em 0;
        border: 0;
        border-top: 1px solid var(--line);
      }

      @media (max-width: 820px) {
        .viewer-layout {
          grid-template-columns: 1fr;
          gap: 20px;
        }

        .toc-panel {
          position: static;
          max-height: min(48vh, 420px);
        }
      }

      @media (max-width: 640px) {
        .topbar__inner,
        main {
          padding-right: 18px;
          padding-left: 18px;
        }

        .brand__divider,
        .brand__label {
          display: none;
        }

        .markdown-body {
          padding: 24px 20px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <div class="brand">
          <img src="/assets/hyundai-hds-logo.png" alt="현대HDS" />
          <span class="brand__divider" aria-hidden="true"></span>
          <span class="brand__label">문서 미리보기</span>
        </div>
        <a class="topbar__link" href="/search.html">← 검색 화면</a>
      </div>
    </header>

    <main>
      <div class="viewer-layout">
        <details class="toc-panel" id="toc-panel" open>
          <summary>문서 목차</summary>
          <nav class="toc-nav" id="toc-nav" aria-label="문서 목차">
            <p class="toc-nav__empty">제목을 분석하고 있습니다.</p>
          </nav>
        </details>

        <div class="document-column">
          <section class="document-head" aria-labelledby="document-title">
            <p class="document-head__eyebrow">MARKDOWN VIEW</p>
            <h1 id="document-title">문서를 불러오는 중입니다</h1>
            <p class="document-head__meta" id="document-meta"></p>
            <div class="document-actions" id="document-actions" hidden>
              <a class="button button--primary" id="original-download" href="#">
                원문 다운로드
              </a>
              <a class="button" id="markdown-download" href="#">MD 다운로드</a>
            </div>
          </section>

          <article class="viewer" aria-live="polite">
            <div class="viewer__status" id="viewer-status">
              Markdown 문서를 안전하게 변환하고 있습니다.
            </div>
            <div class="markdown-body" id="markdown-content" hidden></div>
          </article>
        </div>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const assetId = params.get("asset_id") || "";
      const versionId = params.get("version_id") || "";
      const uuidPattern =
        /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

      const title = document.querySelector("#document-title");
      const meta = document.querySelector("#document-meta");
      const status = document.querySelector("#viewer-status");
      const content = document.querySelector("#markdown-content");
      const tocPanel = document.querySelector("#toc-panel");
      const tocNav = document.querySelector("#toc-nav");
      const actions = document.querySelector("#document-actions");
      const originalDownload = document.querySelector("#original-download");
      const markdownDownload = document.querySelector("#markdown-download");

      function showError(message) {
        title.textContent = "문서를 표시할 수 없습니다";
        status.textContent = message;
        status.classList.add("viewer__status--error");
      }

      function buildTableOfContents() {
        const headings = [...content.querySelectorAll("h1, h2, h3")];
        tocNav.replaceChildren();
        if (headings.length === 0) {
          const empty = document.createElement("p");
          empty.className = "toc-nav__empty";
          empty.textContent = "이 문서에는 목차로 표시할 제목이 없습니다.";
          tocNav.append(empty);
          return;
        }

        const usedIds = new Set();
        const links = new Map();
        headings.forEach((heading, index) => {
          const baseId =
            heading.textContent
              .trim()
              .toLowerCase()
              .replace(/[^0-9a-z가-힣]+/g, "-")
              .replace(/^-|-$/g, "") || `section-${index + 1}`;
          let headingId = baseId;
          let suffix = 2;
          while (usedIds.has(headingId)) headingId = `${baseId}-${suffix++}`;
          usedIds.add(headingId);
          heading.id = headingId;

          const link = document.createElement("a");
          link.href = `#${headingId}`;
          link.textContent = heading.textContent.trim() || `항목 ${index + 1}`;
          link.dataset.level = heading.tagName.slice(1);
          link.addEventListener("click", () => {
            if (window.matchMedia("(max-width: 820px)").matches) {
              tocPanel.open = false;
            }
          });
          links.set(heading, link);
          tocNav.append(link);
        });

        const observer = new IntersectionObserver(
          (entries) => {
            const visible = entries
              .filter((entry) => entry.isIntersecting)
              .sort((left, right) => left.boundingClientRect.top - right.boundingClientRect.top);
            if (visible.length === 0) return;
            links.forEach((link) => link.classList.remove("is-active"));
            links.get(visible[0].target)?.classList.add("is-active");
          },
          { rootMargin: "-88px 0px -70% 0px", threshold: 0 },
        );
        headings.forEach((heading) => observer.observe(heading));
        links.get(headings[0])?.classList.add("is-active");
      }

      async function loadMarkdown() {
        if (!uuidPattern.test(assetId) || !uuidPattern.test(versionId)) {
          showError("올바른 문서 식별자가 없습니다. 검색 화면에서 다시 열어 주세요.");
          return;
        }

        const baseUrl = `/api/v1/assets/${encodeURIComponent(assetId)}/versions/${encodeURIComponent(versionId)}`;
        originalDownload.href = `${baseUrl}/download`;
        markdownDownload.href = `${baseUrl}/download/markdown`;

        try {
          const response = await fetch(`${baseUrl}/markdown`, {
            credentials: "same-origin",
            headers: { Accept: "application/json" },
          });
          if (response.status === 401) {
            window.location.replace("/login");
            return;
          }
          if (!response.ok) {
            const payload = await response.json().catch(() => ({}));
            throw new Error(payload.detail || "문서 조회에 실패했습니다.");
          }

          const payload = await response.json();
          title.textContent = payload.title || "제목 없는 문서";
          document.title = `${title.textContent} · 문서 미리보기`;
          meta.textContent = [
            payload.source_filename,
            payload.version_label && `버전 ${payload.version_label}`,
          ]
            .filter(Boolean)
            .join(" · ");

          // 서버가 허용 목록으로 정제한 HTML만 반환한다. 브라우저에서 원본 Markdown을
          // 직접 변환하지 않아 업로드 문서의 script나 event 속성이 실행되지 않는다.
          content.innerHTML = payload.html;
          buildTableOfContents();
          status.hidden = true;
          content.hidden = false;
          actions.hidden = false;
        } catch (error) {
          showError(error.message || "문서 조회 중 오류가 발생했습니다.");
        }
      }

      if (window.matchMedia("(max-width: 820px)").matches) {
        tocPanel.open = false;
      }
      loadMarkdown();
    </script>
  </body>
</html>

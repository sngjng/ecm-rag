# 공통 기본값. 환경 차이는 config/profiles/*.yaml에서 덮어쓴다.
# 비밀번호, 외부 모델 API 키, Java wrapper 경로는 ${ENV_NAME} 표현식으로 주입한다.
default_profile: local

runtime:
  environment: local
  os: unknown
  python: "3.11"

server:
  # profile의 문서용 값이며 bin/start.sh 실행 시 ECM_RAG_HOST(기본 0.0.0.0)가 우선한다.
  host: 127.0.0.1
  port: 8300
  api_prefix: /api/v1
  docs_enabled: false
  # Uvicorn 프로세스와 프로세스별 동시 요청 상한. 서버 사양에 맞게 환경변수로 조정한다.
  workers: "${ECM_RAG_API_WORKERS:-2}"
  limit_concurrency: "${ECM_RAG_API_LIMIT_CONCURRENCY:-100}"
  backlog: "${ECM_RAG_API_BACKLOG:-256}"
  # 사용자 1회 업로드 원본 파일 크기 상한(MiB). 모든 profile의 기본값이다.
  max_upload_mb: 5

paths:
  upload_root: artifacts/uploads
  artifact_root: artifacts/processed
  web_root: web

database:
  engine: postgresql
  dsn: "${RAG_DB_DSN:-}"
  connect_timeout_seconds: 10
  schema_name: rag
  vector:
    provider: pgvector
    distance_metric: cosine
    hnsw_ef_search: 100

models:
  llm:
    provider: openai_compatible
    base_url: "${RAG_LLM_URL:-http://127.0.0.1:8000/v1}"
    api_key: "${RAG_LLM_API_KEY:-}"
    model: "${RAG_LLM_MODEL:-gemma-4}"
    timeout_seconds: 120
    # 검색 근거만 사용해 답변하도록 생성량과 전달 문맥을 제한한다.
    temperature: 0.1
    max_tokens: 1200
    context_top_k: 8
    max_context_characters: 24000
    # 테스트 LLM의 실제 context 8192에 맞춘 prompt 예산. Java 코드는 토큰 밀도가
    # 높으므로 1문자를 1토큰으로 보수적으로 계산하고 출력/프로토콜 여유를 남긴다.
    context_window_tokens: 8192
    prompt_safety_tokens: 1000
    estimated_characters_per_token: 1.0
    max_history_characters: 1500
  embedding:
    provider: openai_compatible
    # OpenAI 호환 요청: POST body는 {"model": ..., "input": [...]} 형식이어야 한다.
    base_url: "${RAG_EMBED_URL:-http://127.0.0.1:8200/v1/embeddings}"
    api_key: "${RAG_EMBED_API_KEY:-}"
    model: "${RAG_EMBED_MODEL:-bge-m3}"
    dimension: 1024
    batch_size: 8
    max_input_characters: 24000
    timeout_seconds: 120
  reranker:
    enabled: false
    provider: local_flag_embedding
    model_path: "${RAG_RERANK_MODEL_PATH:-}"
    use_fp16: false
    top_k: 10

solutions:
  document_parser: docling
  ocr: easyocr
  # EasyOCR를 명시적으로 선택하고 한글/영문 인식 모델을 사용한다.
  easyocr_languages: [ko, en]
  docling:
    artifacts_path: "${RAG_DOCLING_ARTIFACTS:-}"
    require_local_artifacts: false
    table_mode: accurate
    do_cell_matching: true
  drm:
    enabled: false
    command: "${RAG_DRM_COMMAND:-}"
    timeout_seconds: 120
  # JAR의 바이트코드는 실행하지 않고 CFR로 Java 소스 형태로 복원한다. CFR 파일은
  # 폐쇄망 반입 후 환경 변수로 지정하며, 아래 상한은 ZIP bomb와 과도한 임베딩을 막는다.
  jar_decompiler:
    backend: cfr
    java_command: "${RAG_JAVA_COMMAND:-java}"
    cfr_jar_path: "${RAG_CFR_JAR_PATH:-}"
    timeout_seconds: 300
    max_class_files: 2000
    max_uncompressed_mb: 200
    max_java_file_kb: 2048

ingestion:
  default_lifecycle_status: approved
  # queued + processing 작업이 이 값 이상이면 신규 접수를 429로 거부해 저장소를 보호한다.
  max_pending_jobs: 100
  # 기존 문서 후보가 발견되어도 자동 병합하지 않고 업로드 사용자에게 확인받는다.
  duplicate_detection:
    enabled: true
    max_candidates: 5
  allowed_extensions:
    document: [.pdf, .docx, .txt, .md]
    incident: [.txt, .md]
    error_trace: [.log, .txt]
    source_code: [.py, .java, .jar, .sql, .js, .sh, .yml, .yaml]

worker:
  poll_seconds: 3
  # 여러 worker가 공평하게 작업을 가져가도록 프로세스당 한 건씩 선점한다.
  claim_batch_size: 1
  processes: "${ECM_RAG_WORKER_PROCESSES:-2}"
  lease_seconds: 900
  max_attempts: 3
  worker_name: "${RAG_WORKER_NAME:-}"

retrieval:
  exact_top_k: 30
  lexical_top_k: 40
  vector_top_k: 40
  # cosine distance가 이 값보다 큰 후보는 무관한 문서로 판단한다. 임베딩 모델을
  # 교체하면 대표 질문으로 0.45~0.70 범위를 평가한 뒤 조정한다.
  max_vector_distance: 0.55
  fusion_top_k: 30
  rrf_k: 60
  default_limit: 10
  max_limit: 30
  current_versions_only: true
  approved_versions_only: true
  expand_neighbors: 1

security:
  authentication:
    # 임시 운영 모드: false이면 로그인/세션 없이 업로드·검색 API를 사용할 수 있다.
    # 사내 Java 인증 구현 후 .env의 RAG_AUTH_ENABLED=true로 전환한다.
    enabled: "${RAG_AUTH_ENABLED:-false}"
    # 인증 활성화 후 FastAPI endpoint가 service/login.py의 구현 함수를 호출한다.
    # 기존 Java wrapper 연동이 필요한 환경은 provider를 java_command로 바꿀 수 있다.
    provider: python_module
    java_command: "${RAG_AUTH_COMMAND:-}"
    timeout_seconds: 15
    session_hours: 8
    cookie_name: ecm_rag_session
    cookie_secure: true
    cookie_samesite: strict
    # 인증 비활성 기간의 업로드 감사 이력에 기록할 공통 사용자 정보다.
    temporary_employee_id: temporary
    temporary_employee_name: 임시 사용자
    temporary_department: IDC본부

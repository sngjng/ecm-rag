# 공통 기본값. 환경 차이는 config/profiles/*.yaml에서 덮어쓴다.
# 비밀번호, 외부 모델 API 키, Java wrapper 경로는 ${ENV_NAME} 표현식으로 주입한다.
default_profile: local

runtime:
  environment: local
  os: unknown
  python: "3.11"

server:
  host: 127.0.0.1
  port: 8300
  api_prefix: /api/v1
  docs_enabled: false
  max_upload_mb: 100

paths:
  upload_root: artifacts/uploads
  artifact_root: artifacts/processed
  web_root: web

database:
  engine: postgresql
  dsn: "${RAG_DB_DSN:-}"
  connect_timeout_seconds: 10
  schema_name: rag
  vector:
    provider: pgvector
    distance_metric: cosine
    hnsw_ef_search: 100

models:
  llm:
    provider: openai_compatible
    base_url: "${RAG_LLM_URL:-http://127.0.0.1:8000/v1}"
    api_key: "${RAG_LLM_API_KEY:-}"
    model: "${RAG_LLM_MODEL:-gemma-4}"
    timeout_seconds: 120
  embedding:
    provider: openai_compatible
    base_url: "${RAG_EMBED_URL:-http://127.0.0.1:8200/v1/embeddings}"
    api_key: "${RAG_EMBED_API_KEY:-}"
    model: "${RAG_EMBED_MODEL:-bge-m3}"
    dimension: 1024
    batch_size: 8
    max_input_characters: 24000
    timeout_seconds: 120
  reranker:
    enabled: false
    provider: local_flag_embedding
    model_path: "${RAG_RERANK_MODEL_PATH:-}"
    use_fp16: false
    top_k: 10

solutions:
  document_parser: docling
  ocr: easyocr
  # EasyOCR를 명시적으로 선택하고 한글/영문 인식 모델을 사용한다.
  easyocr_languages: [ko, en]
  docling:
    artifacts_path: "${RAG_DOCLING_ARTIFACTS:-}"
    require_local_artifacts: false
    table_mode: accurate
    do_cell_matching: true
  drm:
    enabled: false
    command: "${RAG_DRM_COMMAND:-}"
    timeout_seconds: 120

ingestion:
  default_lifecycle_status: approved
  # 기존 문서 후보가 발견되어도 자동 병합하지 않고 업로드 사용자에게 확인받는다.
  duplicate_detection:
    enabled: true
    title_similarity_threshold: 0.72
    max_candidates: 5
  allowed_extensions:
    document: [.pdf, .docx, .txt, .md]
    incident: [.txt, .md]
    error_trace: [.log, .txt]
    source_code: [.py, .java, .sql, .js, .sh, .yml, .yaml]

worker:
  poll_seconds: 3
  claim_batch_size: 5
  lease_seconds: 900
  max_attempts: 3
  worker_name: "${RAG_WORKER_NAME:-}"

retrieval:
  exact_top_k: 30
  lexical_top_k: 40
  vector_top_k: 40
  fusion_top_k: 30
  rrf_k: 60
  default_limit: 10
  max_limit: 30
  current_versions_only: true
  approved_versions_only: true
  expand_neighbors: 1

security:
  authentication:
    # Java 모듈 wrapper는 stdin JSON을 인증하고 stdout으로 사원정보 JSON을 반환한다.
    provider: java_command
    java_command: "${RAG_AUTH_COMMAND:-}"
    timeout_seconds: 15
    session_hours: 8
    cookie_name: ecm_rag_session
    cookie_secure: true
    cookie_samesite: strict

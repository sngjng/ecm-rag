version: 1
disable_existing_loggers: false

formatters:
  timestamped:
    format: "%(asctime)s.%(msecs)03d %(levelname)s %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    formatter: timestamped
    stream: ext://sys.stderr

loggers:
  uvicorn:
    handlers: [console]
    level: INFO
    propagate: false
  uvicorn.error:
    handlers: [console]
    level: INFO
    propagate: false
  uvicorn.access:
    handlers: [console]
    level: INFO
    propagate: false

root:
  handlers: [console]
  level: INFO
